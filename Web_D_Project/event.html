<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Hosting System</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* prevent vertical scrolling */
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      flex-direction: column;
    }

    /* Main Header */
    .main-header {
      background-color: #333;
      color: white;
      position: relative;
      padding: 10px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    /* Dropdown in top-left corner */
    .main-header .dropdown {
      position: absolute;
      top: 10px;
      left: 20px;
    }

    /* Dropdown Button */
    .dropbtn {
      background-color: #222;
      color: white;
      padding: 10px 16px;
      font-size: 16px;
      border: none;
      cursor: pointer;
    }

    /* Dropdown Content */
    .dropdown-content {
      display: none;
      position: absolute;
      top: 40px;
      left: 0;
      background-color: #333;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.3);
      z-index: 1;
      border-radius: 4px;
    }

    .dropdown-content li {
      list-style: none;
    }

    .dropdown-content li a {
      color: white;
      padding: 10px 16px;
      display: block;
      text-decoration: none;
    }

    .dropdown-content li a:hover {
      background-color: #444;
      color: #f9a825;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    /* Profile and Site Title Centered */
    .top-header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    .top-header-content .profile-pic img {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid white;
      object-fit: cover;
      margin-bottom: 10px;
    }

    .site-title {
      font-size: 24px;
      text-align: center;
    }

    /* Gallery Section */
    .container {
      width: 100%;
      padding: 10px;
      max-height: calc(100vh - 80px);
      /* adjust based on header height */
      overflow-y: auto;
    }

    .gallery,
    .video-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }

    .gallery img {
      width: 300px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.4s ease-in-out;
    }

    .gallery img:hover {
      transform: scale(1.1);
    }

    .video-container video,
    .video-container iframe {
      width: 300px;
      height: 200px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* Centered Headings */
    header h1 {
      text-align: center;
    }

    section h2 {
      text-align: center;
      margin-top: 20px;
    }

    /* Responsive Styles */
    @media screen and (max-width: 768px) {
      .site-title {
        font-size: 20px;
        text-align: center;
      }

      .dropbtn {
        font-size: 14px;
        padding: 8px 12px;
      }

      .dropdown-content {
        min-width: 140px;
      }

      .top-header-content .profile-pic img {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>

<body>

  <header class="main-header">
    <div class="dropdown">
      <button class="dropbtn">☰ Event</button>
      <ul class="dropdown-content">
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Admin Login</a></li>
        <li><a href="our_room.html">Rooms</a></li>
        <li><a href="booking.html">Booking</a></li>
        <li><a href="event.html">Event</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About Us</a></li>
      </ul>
    </div>

    <div class="top-header-content">
      <div class="profile-pic">
        <img src="Images/profile.jpg" alt="Profile">
      </div>
      <h1 class="site-title">PURUSHOTTAM MARRIAGE LAWN</h1>
    </div>
  </header>

  <header>
    <h1 style="background-color: antiquewhite;">Our Previous Event</h1>
  </header>

  <div class="container">
    <section>
      <h2>Event Pictures</h2>
      <div class="gallery">
        <img src="Images/2.png" alt="Event Picture" />
        <img src="Images/10.jpg" alt="Event Picture" />
        <img src="Images/11.jpg" alt="Event Picture" />
        <img src="Images/12.jpg" alt="Event Picture" />
        <img src="Images/13.jpg" alt="Event Picture" />
        <img src="Images/14.jpg" alt="Event Picture" />
        <img src="Images/1.png" alt="Event Picture" />
        <img src="Images/3.png" alt="Event Picture" />
      </div>
    </section>

    <section>
      <h2>Event Videos</h2>
      <div class="video-container">
        <video controls>
          <source src="Images/1 (1).mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>

        <iframe src="https://www.youtube.com/embed/HzY7RusdQ8A" frameborder="0" allowfullscreen></iframe>

        <video controls>
          <source src="Images/1 (2).mp4" type="video/mp4" />
          Your browser does not support the video tag.
        </video>
      </div>
    </section>
  </div>
</body>

</html>
