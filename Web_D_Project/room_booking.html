<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Room Booking</title>
  </head>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: white;
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
    }

    form input,
    form select,
    form button {
      width: 100%;
      padding: 14px 1px;
      margin: 12px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #218838;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 20px;
      }

      h2 {
        font-size: 24px;
      }

      form input,
      form select,
      form button {
        font-size: 15px;
        padding: 12px;
      }
    }

    .back-button {
      position: absolute;
      top: 15px;
      left: 15px;
      padding: 10px 15px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }

    .back-button:hover {
      background-color: #2980b9;
    }
  </style>
  <body>
    <a href="javascript:history.back()" class="back-button">← Back</a>

    <div class="container">
      <h2>Room Booking Form</h2>
      <form action="room_booking.php" method="POST">
        <input type="text" name="name" placeholder="Full Name" required />
        <input type="email" name="email" placeholder="Email Address" required />
        <input
          type="text"
          name="contact"
          placeholder="Contact Number"
          required
        />
        <input
          type="number"
          name="persons"
          placeholder="No. of Persons"
          required
        />

        <select
          name="room_type"
          id="room_type"
          onchange="updatePrice()"
          required
        >
          <option value="">-- Select Room Type --</option>
          <option value="Single Bedroom">Single Bedroom</option>
          <option value="Double Bedroom">Double Bedroom</option>
          <option value="Luxury Room">Luxury Room</option>
        </select>

        <input
          type="text"
          id="price"
          name="price"
          readonly
          placeholder="Price"
          required
        />

        <input type="date" name="date" required />
        <button type="submit">Book Now</button>
      </form>
    </div>

    <script src="room_booking.js"></script>
  </body>
</html>
